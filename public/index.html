<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Receptionist</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--tx:#e8eaf0;--mut:#8b91a1;--ac:#6ea8fe;--red:#ff6b6b;--grn:#4cd9a0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:48px 20px 24px;text-align:center}
h1{margin:0 0 8px;font-size:2rem}
header p{margin:0 auto;max-width:560px;color:var(--mut)}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;max-width:1000px;margin:0 auto;padding:16px 20px 48px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 12px;font-size:1rem;color:var(--mut);font-weight:600}
#log{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:12px}
.u{align-self:flex-end;background:var(--ac);color:#0b1220}
.b{align-self:flex-start;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:none;border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:.85rem}
.row{display:flex;gap:8px}
input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.send{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#0b1220;font-weight:600;cursor:pointer}
.ev{border-left:3px solid var(--grn);padding:6px 10px;margin-bottom:8px;background:var(--bg);border-radius:6px;font-size:.9rem}
.ev.urgent{border-color:var(--red)}
.ev b{display:block}
.empty{color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1 id="name">AI Receptionist</h1>
  <p id="sub">Answers FAQs, takes messages, and flags urgent issues to the owner instantly.</p>
</header>
<main>
  <section class="card">
    <h2>Customer chat</h2>
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="in" placeholder="Type a message..." autocomplete="off">
      <button class="send" id="go">Send</button>
    </div>
  </section>
  <aside class="card">
    <h2>Owner dashboard (live)</h2>
    <div id="ev"><p class="empty">Urgent alerts and saved messages appear here.</p></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const sid = crypto.randomUUID();
const log = $('log');

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  log.append(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function showEvent(e) {
  $('ev').querySelector('.empty')?.remove();
  const urgent = e.type === 'flag_urgent';
  const d = document.createElement('div');
  d.className = 'ev' + (urgent ? ' urgent' : '');
  const b = document.createElement('b');
  b.textContent = urgent ? '🚨 Urgent alert sent to owner' : '📝 Message saved';
  const p = document.createElement('div');
  p.textContent = [e.name, e.contact].filter(Boolean).join(' · ') + ' - ' + (e.reason || e.message || '');
  d.append(b, p);
  $('ev').append(d);
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  add(text, 'u');
  $('in').value = '';
  const wait = add('...', 'b');
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sid, text }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    wait.textContent = d.reply;
    d.events.forEach(showEvent);
  } catch (e) {
    wait.textContent = 'Error: ' + e.message;
  }
}

$('go').onclick = () => send($('in').value);
$('in').onkeydown = (e) => { if (e.key === 'Enter') send($('in').value); };

['What are your hours?', 'Where are you located?', 'Please take a message', 'This is an emergency!'].forEach((t) => {
  const c = document.createElement('button');
  c.className = 'chip';
  c.textContent = t;
  c.onclick = () => send(t);
  $('chips').append(c);
});

fetch('/api/info').then((r) => r.json()).then((i) => {
  $('name').textContent = i.name;
  $('sub').textContent = 'Open ' + i.hours + '. Chat with our AI receptionist below.';
  if (i.mock) $('sub').textContent += ' (Demo mode: scripted replies)';
  add(i.greeting, 'b');
});
</script>
</body>
</html>
